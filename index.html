<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #2f5d46;
      font-family: 'Georgia', serif;
      color: #2c3531;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
      min-height: 100vh;
    }
    .tarjeta {
      background-color: #f7f4ed;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
      border: 1px solid #d8d0c0;
    }
    .subtitulo {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7c72;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 34px;
      font-weight: normal;
      color: #2f5d46;
      margin-bottom: 16px;
    }
    .fecha {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid #dcd4c6;
    }
    .btn-musica {
      background-color: #2f5d46;
      color: #f7f4ed;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-family: 'Georgia', serif;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(47, 93, 70, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }
    .btn-musica:active { transform: scale(0.97); }

    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .galeria-grid img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      cursor: zoom-in;
      border: 1px solid #d8d0c0;
      display: block;
    }
    .visor-zoom {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .visor-zoom.activo {
      display: flex;
    }
    .visor-zoom img {
      max-width: 95vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .cerrar-zoom {
      position: fixed;
      top: 16px;
      right: 20px;
      background: #f7f4ed;
      color: #2c3531;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    /* Style para el Formulario de Google Sheets */
    .form-boda {
      margin-top: 12px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .campo-boda label {
      display: block;
      font-size: 13px;
      color: #2c3531;
      margin-bottom: 4px;
    }
    .campo-boda input,
    .campo-boda select,
    .campo-boda textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #c9bfa9;
      background-color: #ffffff;
      font-family: 'Georgia', serif;
      font-size: 14px;
      color: #2c3531;
    }
    .btn-enviar-boda {
      background-color: #2f5d46;
      color: #f7f4ed;
      border: none;
      padding: 12px 20px;
      border-radius: 999px;
      font-family: 'Georgia', serif;
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
    }
    .estado-envio {
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <main class="tarjeta">
    <p class="subtitulo">¡Nos Casamos!</p>
    <h1>Sandra Isabel</h1>
    <h1>&</h1>
    <h1>Luis Hernán</h1>
    <p class="fecha">Diciembre 2026</p>

    <!-- Reproductor de música -->
    <audio id="audioBoda" src="./CancionBoda.mp3" loop preload="auto"></audio>
    <button id="btnAudio" class="btn-musica" onclick="alternarMusica()">
      <span id="iconoAudio">▶</span>
      <span id="textoAudio">Escuchar nuestra canción</span>
    </button>

    <!-- Sección Ubicación -->
    <section style="margin-top: 28px; padding-top: 22px; border-top: 1px solid #dcd4c6;">
      <p class="subtitulo" style="margin-bottom: 6px;">Ubicación</p>
      <p style="font-size: 16px; color: #2c3531; margin-bottom: 12px;">
        <strong>Finca Hotel Santa Sofía</strong><br>
        <span style="font-size: 14px; color: #555;">Las camelias, Dosquebradas, Risaralda</span>
      </p>

      <a id="enlaceVerMapa" href="#mapa-boda" onclick="alternarMapaBoda(event)" style="
        display: inline-block;
        color: #2f5d46;
        font-size: 14px;
        text-decoration: underline;
        margin-bottom: 12px;
        cursor: pointer;">
        Ver mapa interactivo
      </a>

      <div id="contenedorMapaBoda" style="
        display: none;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #d8d0c0;
        margin-top: 6px;">
        <iframe
          id="iframeMapaBoda"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d327.0966360751308!2d-75.70564778379044!3d4.83317042444017!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e38812c01df66ed%3A0xe9f6822cd94a4e90!2sSanta%20Sof%C3%ADa!5e1!3m2!1ses!2sco!4v1795117154590!5m2!1ses!2sco"
          width="100%"
          height="220"
          style="border:0; display:block;"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>

    <!-- Sección Galería con Zoom -->
    <section style="margin-top: 28px; padding-top: 22px; border-top: 1px solid #dcd4c6;">
      <p class="subtitulo" style="margin-bottom: 4px;">Momentos</p>
      <p style="font-size: 13px; color: #666; margin-bottom: 8px;">Toca una foto para verla más grande</p>

      <div class="galeria-grid">
        <img src="./img/Foto1.jpeg" alt="Foto 1" onclick="abrirZoom(this.src, this.alt)">
        <img src="./img/Foto2.jpeg" alt="Foto 2" onclick="abrirZoom(this.src, this.alt)">
      </div>
    </section>

    <!-- Sección Confirmación de Asistencia -->
    <section style="margin-top: 28px; padding-top: 22px; border-top: 1px solid #dcd4c6;">
      <p class="subtitulo" style="margin-bottom: 6px;">Confirmar Asistencia</p>

      <a id="enlaceAbrirFormulario" href="#confirmar-asistencia" onclick="alternarFormularioBoda(event)" style="
        display: inline-block;
        color: #2f5d46;
        font-size: 14px;
        text-decoration: underline;
        margin-bottom: 10px;
        cursor: pointer;">
        Abrir formulario de confirmación
      </a>

      <div id="contenedorFormularioBoda" style="display: none;">
        <form id="formConfirmacion" class="form-boda" onsubmit="enviarConfirmacion(event)">
          <div class="campo-boda">
            <label for="nombreInvitado">Nombre del invitado *</label>
            <input type="text" id="nombreInvitado" name="nombre" required placeholder="Ej. Laura Gómez">
          </div>

          <div class="campo-boda">
            <label for="asisteInvitado">¿Asistes? *</label>
            <select id="asisteInvitado" name="asiste" required onchange="ajustarCuposPorAsistencia()">
              <option value="">Selecciona una opción</option>
              <option value="Sí">Sí</option>
              <option value="No">No</option>
            </select>
          </div>

          <div class="campo-boda">
            <label for="cuposInvitado">Cupos *</label>
            <input type="number" id="cuposInvitado" name="cupos" min="1" max="5" value="1" required oninput="validarCuposEnVivo()">
          </div>

          <div class="campo-boda">
            <label for="mensajeInvitado">Mensaje (Opcional)</label>
            <textarea id="mensajeInvitado" name="mensaje" rows="3" placeholder="Escribe un mensaje o dedicatoria..."></textarea>
          </div>

          <button type="submit" id="btnEnviarConfirmacion" class="btn-enviar-boda">
            Enviar confirmación
          </button>

          <p id="estadoConfirmacion" class="estado-envio"></p>
        </form>
      </div>
    </section>

  </main>

  <!-- Visor ampliado -->
  <div id="visorZoom" class="visor-zoom" onclick="cerrarZoom(event)">
    <button type="button" class="cerrar-zoom" onclick="cerrarZoom(event)" aria-label="Cerrar">×</button>
    <img id="imagenZoom" src="" alt="">
  </div>

  <script>
    const audio = document.getElementById("audioBoda");
    const icono = document.getElementById("iconoAudio");
    const texto = document.getElementById("textoAudio");

    function alternarMusica() {
      if (audio.paused) {
        audio.play().then(() => {
          icono.textContent = "❚❚";
          texto.textContent = "Pausar música";
        }).catch(() => {
          texto.textContent = "Toca de nuevo para sonar";
        });
      } else {
        audio.pause();
        icono.textContent = "▶";
        texto.textContent = "Reanudar música";
      }
    }

    function alternarMapaBoda(evento) {
      if (evento) evento.preventDefault();
      const contenedor = document.getElementById("contenedorMapaBoda");
      const enlace = document.getElementById("enlaceVerMapa");
      if (!contenedor || !enlace) return;

      const estaOculto = contenedor.style.display === "none";
      contenedor.style.display = estaOculto ? "block" : "none";
      enlace.textContent = estaOculto ? "Ocultar mapa" : "Ver mapa interactivo";
    }

    function abrirZoom(src, alt) {
      const visor = document.getElementById("visorZoom");
      const img = document.getElementById("imagenZoom");
      if (!visor || !img) return;
      img.src = src;
      img.alt = alt || "Foto ampliada";
      visor.classList.add("activo");
    }

    function cerrarZoom(evento) {
      const visor = document.getElementById("visorZoom");
      if (!visor) return;
      if (!evento || evento.target === visor || evento.target.classList.contains("cerrar-zoom")) {
        visor.classList.remove("activo");
      }
    }

    const URL_SCRIPT_CONFIRMACION = "https://script.google.com/macros/s/AKfycbxeDpmq7mo5p_txAuzmMphRx7Lq0ixLTnHuMpvrs8Up-Cz5Mo-4PA7T9rIL6blEvK2O/exec";

    async function enviarConfirmacion(evento) {
      evento.preventDefault();
      const form = document.getElementById("formConfirmacion");
      const btn = document.getElementById("btnEnviarConfirmacion");
      const estado = document.getElementById("estadoConfirmacion");

      const payload = {
        nombre: document.getElementById("nombreInvitado").value.trim(),
        asiste: document.getElementById("asisteInvitado").value.trim(),
        cupos: document.getElementById("cuposInvitado").value.trim(),
        mensaje: document.getElementById("mensajeInvitado").value.trim()
      };

      if (payload.asiste === "No") {
        payload.cupos = "0";
      }

      if (payload.asiste === "Sí" && (!payload.cupos || Number(payload.cupos) < 1)) {
        estado.style.color = "#9e2a2b";
        estado.textContent = "Si confirmas asistencia, el número de cupos debe ser de 1 o más.";
        document.getElementById("cuposInvitado").focus();
        return;
      }

      if (!payload.nombre || !payload.asiste) {
        estado.style.color = "#9e2a2b";
        estado.textContent = "Por favor completa tu nombre y si asistes.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Enviando...";
      estado.style.color = "#555";
      estado.textContent = "Guardando tu confirmación...";

      try {
        await fetch(URL_SCRIPT_CONFIRMACION, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        estado.style.color = "#2f5d46";
        estado.textContent = "¡Listo! Tu confirmación quedó registrada.";
        form.reset();
        document.getElementById("cuposInvitado").value = "1";
        ajustarCuposPorAsistencia();
      } catch (err) {
        estado.style.color = "#9e2a2b";
        estado.textContent = "Hubo un problema al enviar. Intenta de nuevo.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar confirmación";
      }
    }

    function alternarFormularioBoda(evento) {
      if (evento) evento.preventDefault();
      const contenedor = document.getElementById("contenedorFormularioBoda");
      const enlace = document.getElementById("enlaceAbrirFormulario");
      if (!contenedor || !enlace) return;

      const estaOculto = contenedor.style.display === "none";
      contenedor.style.display = estaOculto ? "block" : "none";
      enlace.textContent = estaOculto ? "Ocultar formulario" : "Abrir formulario de confirmación";
    }

    function ajustarCuposPorAsistencia() {
      const asiste = document.getElementById("asisteInvitado");
      const cupos = document.getElementById("cuposInvitado");
      const estado = document.getElementById("estadoConfirmacion");
      if (!asiste || !cupos) return;

      if (asiste.value === "No") {
        cupos.value = "0";
        cupos.min = "0";
        cupos.readOnly = true;
        cupos.disabled = true;
        cupos.style.backgroundColor = "#ece8df";
        cupos.style.cursor = "not-allowed";
        if (estado) {
          estado.style.color = "#555";
          estado.textContent = "";
        }
      } else {
        cupos.disabled = false;
        cupos.readOnly = false;
        cupos.min = "1";
        if (Number(cupos.value) < 1) {
          cupos.value = "1";
        }
        cupos.style.backgroundColor = "#ffffff";
        cupos.style.cursor = "text";
      }
    }

    function validarCuposEnVivo() {
      const asiste = document.getElementById("asisteInvitado");
      const cupos = document.getElementById("cuposInvitado");
      const estado = document.getElementById("estadoConfirmacion");
      if (!asiste || !cupos) return;

      if (asiste.value === "No") {
        cupos.value = "0";
        return;
      }

      if (asiste.value === "Sí") {
        if (cupos.value !== "" && Number(cupos.value) <= 0) {
          cupos.value = "1";
          if (estado) {
            estado.style.color = "#9e2a2b";
            estado.textContent = "Si asistes, debes indicar al menos 1 cupo.";
          }
        }
      }
    }
  </script>

</body>
</html>
